[build]
  publish = "frontend"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Netlify Proxy Rewrite: Routes API calls directly to Render backend without CORS friction
[[redirects]]
  from = "/api/*"
  to = "https://mindverse-learning-lab.onrender.com/api/:splat"
  status = 200
  force = true

# Single-Page-App and clean HTML routing fallbacks
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

